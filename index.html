<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proveedores de Velas Artesanales</title>
<meta name="description" content="Encontrá proveedores de insumos para velas, comparé precios y elegí la mejor opción desde una única aplicación.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Velas Artesanales">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- PANTALLA DE BIENVENIDA (primera vez) -->
<div id="pantalla-bienvenida" class="pantalla-full oculto">
  <div class="bienvenida-card">
    <div class="logo-llama" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="92" height="92">
        <circle cx="50" cy="50" r="50" fill="#EAE7E2"/>
        <circle cx="50" cy="50" r="44" fill="#FFFFFF"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#D9B974" stroke-width="1.6"/>
        <line x1="34" y1="60" x2="28" y2="46" stroke="#5D6D44" stroke-width="1.2"/>
        <circle cx="32.5" cy="56.5" r="2.1" fill="#B4ACC8"/>
        <circle cx="31" cy="53" r="2.1" fill="#968CAF"/>
        <circle cx="29.5" cy="49.5" r="2.1" fill="#B4ACC8"/>
        <circle cx="28" cy="46" r="2.1" fill="#968CAF"/>
        <path d="M66 34 C70 30 76 28 80 26 C78 30 74 35 70 38 C68 39.5 66.5 37 66 34Z" fill="#D9B974"/>
        <line x1="67" y1="35" x2="79" y2="27" stroke="#B08F52" stroke-width="0.8"/>
        <rect x="42" y="53" width="16" height="24" rx="4" fill="#5D6D44"/>
        <line x1="50" y1="45" x2="50" y2="53" stroke="#2A3444" stroke-width="2"/>
        <path d="M50 28 C46 34 44 38 44 41.5 C44 45 47 47.5 50 47.5 C53 47.5 56 45 56 41.5 C56 38 54 34 50 28Z" fill="#B08F52"/>
      </svg>
    </div>
    <h1>Bienvenido a Proveedores de Velas Artesanales</h1>
    <p>Encontrá, comparé y elegí el mejor proveedor para tus velas.</p>
    <label class="campo">
      <span>¿Cómo te llamamos?</span>
      <input type="text" id="input-nombre-usuario" placeholder="Tu nombre" autocomplete="given-name">
    </label>
    <button class="btn-principal" id="btn-comenzar">Comenzar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="oculto">

  <header class="app-header" id="app-header"></header>

  <main id="contenido-principal"></main>

  <nav class="nav-inferior" id="nav-inferior"></nav>
</div>

<!-- MODAL CONFIRMACION -->
<div id="modal-confirmar" class="modal oculto" role="alertdialog" aria-label="Confirmar acción">
  <div class="modal-contenido modal-chico">
    <p id="modal-confirmar-texto"></p>
    <div class="modal-footer">
      <button class="btn-secundario" id="btn-confirmar-cancelar">Cancelar</button>
      <button class="btn-peligro" id="btn-confirmar-aceptar">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

<script src="./proveedores.js"></script>
<script src="./app.js"></script>
</body>
</html>
