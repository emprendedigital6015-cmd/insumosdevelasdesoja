<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELAS</title>
<meta name="description" content="Encontrá proveedores de insumos para velas, comparé precios y elegí la mejor opción desde una única aplicación.">
<meta name="theme-color" content="#FFF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VELAS">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- PANTALLA DE BIENVENIDA (primera vez) -->
<div id="pantalla-bienvenida" class="pantalla-full oculto">
  <div class="bienvenida-card">
    <div class="logo-llama" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="72" height="72">
        <defs>
          <linearGradient id="velasGradWelcome" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6B6B"/>
            <stop offset="100%" stop-color="#2EC4B6"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#velasGradWelcome)"/>
        <rect x="32" y="54" width="36" height="30" rx="6" fill="#FFFFFF"/>
        <path d="M50 60 L54.5 66 C56 68 55 71 52.5 71.5 C51 71.8 50 71 50 71 C50 71 49 71.8 47.5 71.5 C45 71 44 68 45.5 66 Z" fill="#FF6B6B"/>
        <line x1="50" y1="46" x2="50" y2="55" stroke="#3C322D" stroke-width="2"/>
        <path d="M50 20 C44 30 41 36 41 41 C41 46.5 45 50 50 50 C55 50 59 46.5 59 41 C59 36 56 30 50 20Z" fill="#FF9F1C"/>
        <ellipse cx="50" cy="43" rx="4.5" ry="6" fill="#FFC857"/>
        <path d="M22 18 L24 24 L30 26 L24 28 L22 34 L20 28 L14 26 L20 24 Z" fill="#FFFFFF"/>
        <path d="M18 34 L19 37 L22 38 L19 39 L18 42 L17 39 L14 38 L17 37 Z" fill="#FFFFFF" opacity="0.85"/>
      </svg>
    </div>
    <h1>Bienvenido a VELAS</h1>
    <p>Encontrá, comparé y elegí el mejor proveedor para tus velas.</p>
    <label class="campo">
      <span>¿Cómo te llamamos?</span>
      <input type="text" id="input-nombre-usuario" placeholder="Tu nombre" autocomplete="given-name">
    </label>
    <button class="btn-principal" id="btn-comenzar">Comenzar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="oculto">

  <header class="app-header" id="app-header"></header>

  <main id="contenido-principal"></main>

  <nav class="nav-inferior" id="nav-inferior">
    <button class="nav-item activo" data-pantalla="inicio" aria-label="Inicio">
      <span class="nav-icono" aria-hidden="true">🏠</span>
      <span class="nav-texto">Inicio</span>
    </button>
    <button class="nav-item" data-pantalla="buscar" aria-label="Buscar y comparar">
      <span class="nav-icono" aria-hidden="true">🔍</span>
      <span class="nav-texto">Buscar</span>
    </button>
    <button class="nav-item" data-pantalla="favoritos" aria-label="Favoritos">
      <span class="nav-icono" aria-hidden="true">♥</span>
      <span class="nav-texto">Favoritos</span>
    </button>
    <button class="nav-item" data-pantalla="configuracion" aria-label="Configuración">
      <span class="nav-icono" aria-hidden="true">⚙️</span>
      <span class="nav-texto">Ajustes</span>
    </button>
  </nav>
</div>

<!-- MODAL CONFIRMACION -->
<div id="modal-confirmar" class="modal oculto" role="alertdialog" aria-label="Confirmar acción">
  <div class="modal-contenido modal-chico">
    <p id="modal-confirmar-texto"></p>
    <div class="modal-footer">
      <button class="btn-secundario" id="btn-confirmar-cancelar">Cancelar</button>
      <button class="btn-peligro" id="btn-confirmar-aceptar">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

<script src="./proveedores.js"></script>
<script src="./app.js"></script>
</body>
</html>
