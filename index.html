<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELAS</title>
<meta name="description" content="Encontrá proveedores de insumos para velas, comparé precios y elegí la mejor opción desde una única aplicación.">
<meta name="theme-color" content="#FFF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VELAS">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- PANTALLA DE BIENVENIDA (primera vez) -->
<div id="pantalla-bienvenida" class="pantalla-full oculto">
  <div class="bienvenida-card">
    <div class="logo-llama" aria-hidden="true">
      <svg viewBox="0 0 64 84" width="46" height="60">
        <path d="M32 4 L44 34 Q47 42 44 50 Q40 58 32 58 Q24 58 20 50 Q17 42 20 34 Z" fill="var(--coral-soft)"/>
        <ellipse cx="32" cy="46" rx="7" ry="11" fill="var(--coral)"/>
        <rect x="20" y="56" width="24" height="26" rx="6" fill="var(--card)" stroke="var(--linea)" stroke-width="1.5"/>
        <path d="M50 12 L52 18 L58 20 L52 22 L50 28 L48 22 L42 20 L48 18 Z" fill="var(--mostaza)"/>
      </svg>
    </div>
    <h1>Bienvenido a VELAS</h1>
    <p>Encontrá, comparé y elegí el mejor proveedor para tus velas.</p>
    <label class="campo">
      <span>¿Cómo te llamamos?</span>
      <input type="text" id="input-nombre-usuario" placeholder="Tu nombre" autocomplete="given-name">
    </label>
    <button class="btn-principal" id="btn-comenzar">Comenzar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="oculto">

  <header class="app-header">
    <div class="header-titulo">
      <svg viewBox="0 0 64 84" width="20" height="26" aria-hidden="true">
        <path d="M32 4 L44 34 Q47 42 44 50 Q40 58 32 58 Q24 58 20 50 Q17 42 20 34 Z" fill="var(--coral-soft)"/>
        <ellipse cx="32" cy="46" rx="7" ry="11" fill="var(--coral)"/>
        <rect x="20" y="56" width="24" height="26" rx="6" fill="var(--card)" stroke="var(--linea)" stroke-width="1.5"/>
      </svg>
      <span>VELAS</span>
    </div>
  </header>

  <main id="contenido-principal"></main>

  <nav class="nav-inferior" id="nav-inferior">
    <button class="nav-item activo" data-pantalla="inicio" aria-label="Inicio">
      <span class="nav-icono" aria-hidden="true">🏠</span>
      <span class="nav-texto">Inicio</span>
    </button>
    <button class="nav-item" data-pantalla="buscar" aria-label="Buscar y comparar">
      <span class="nav-icono" aria-hidden="true">🔍</span>
      <span class="nav-texto">Buscar</span>
    </button>
    <button class="nav-item" data-pantalla="favoritos" aria-label="Favoritos">
      <span class="nav-icono" aria-hidden="true">♥</span>
      <span class="nav-texto">Favoritos</span>
    </button>
    <button class="nav-item" data-pantalla="configuracion" aria-label="Configuración">
      <span class="nav-icono" aria-hidden="true">⚙️</span>
      <span class="nav-texto">Ajustes</span>
    </button>
  </nav>
</div>

<!-- MODAL FILTROS -->
<div id="modal-filtros" class="modal oculto" role="dialog" aria-label="Filtros avanzados">
  <div class="modal-contenido">
    <div class="modal-header">
      <h2>Filtros</h2>
      <button class="btn-cerrar-modal" data-close="modal-filtros" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modal-filtros-body"></div>
    <div class="modal-footer">
      <button class="btn-secundario" id="btn-limpiar-filtros">Limpiar filtros</button>
      <button class="btn-principal" id="btn-aplicar-filtros">Ver resultados</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMACION -->
<div id="modal-confirmar" class="modal oculto" role="alertdialog" aria-label="Confirmar acción">
  <div class="modal-contenido modal-chico">
    <p id="modal-confirmar-texto"></p>
    <div class="modal-footer">
      <button class="btn-secundario" id="btn-confirmar-cancelar">Cancelar</button>
      <button class="btn-peligro" id="btn-confirmar-aceptar">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

<script src="./proveedores.js"></script>
<script src="./app.js"></script>
</body>
</html>
